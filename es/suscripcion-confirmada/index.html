<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Suscripción confirmada · Bernardo Ramirez</title>
<link rel="icon" href="/assets/logo-oficial.svg" type="image/svg+xml">
<style>
  :root{--creme:#FAF8F4;--areia:#EAE5DD;--tinta:#211E1C;--pet:#155A6C}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--creme);color:var(--tinta);font:17px/1.6 "Avenir Next","Nunito Sans",Arial,sans-serif;padding:32px 20px}
  main{max-width:560px;width:100%}
  img{display:block;width:220px;height:auto;margin:0 0 40px}
  h1{font:400 36px/1.15 Athelas,Literata,Georgia,serif;margin:0 0 16px}
  p{margin:0 0 28px}
  a.btn{display:inline-block;background:var(--pet);color:#fff;text-decoration:none;font-weight:600;font-size:16px;padding:12px 22px;border-radius:4px}
  a.btn:focus-visible{outline:3px solid var(--tinta);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/logo-oficial.svg" alt="Bernardo Ramirez" width="220">
  <h1>Gracias. Ya estás dentro.</h1>
  <p>Tu suscripción está confirmada. En unos momentos recibirás un mensaje de bienvenida en tu correo.</p>
  <a class="btn" href="/es/">Volver al inicio</a>
</main>
</body>
</html>
